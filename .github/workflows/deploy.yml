name: Frontend Deploy

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [master]

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy frontend over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/globaloil/frontend
            git fetch origin master
            git reset --hard origin/master

            docker compose -p globaloil-frontend --env-file .env \
              -f docker-compose.prod.yml \
              up -d --build --force-recreate frontend

            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
                exit 0
              fi
              sleep 3
            done

            docker compose -p globaloil-frontend --env-file .env \
              -f docker-compose.prod.yml logs --tail=100 frontend
            exit 1
